name: Local integrity and workflow checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate catalogue and skills without model calls
        run: python -m genius validate > validation.json
      - name: Run deterministic software tests
        run: python -m unittest discover -s tests -v
